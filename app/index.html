<style>
:root{--blue:#0b3a8f;--blue2:#0e4bb5;--orange:#ff5a0a;--yellow:#ffc514;--cream:#fbf6e8;--ink:#14213d;--mut:#5b6478;--line:#ebe5d3;--ok:#16a34a;--bad:#dc2626;--bg:#f7f3e8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Hind Siliguri','Hind',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
html[lang=hi] body{font-family:'Hind','Hind Siliguri',system-ui,sans-serif}
button,input,select,textarea{font:inherit}
.top{background:linear-gradient(135deg,#0a3480 0%,#0b3a8f 55%,#0e4bb5 100%);color:#fff;padding:10px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(11,58,143,.28);border-bottom:3px solid var(--yellow)}
.top .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand img.shield{height:40px;width:auto;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.brand img.word{height:22px;width:auto;display:block}
.brand .sub{font-size:12.5px;color:#dbe6ff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub b{color:var(--yellow);font-weight:600}
.lang{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px;flex:0 0 auto}
.lang button{border:0;background:none;color:#e6eeff;font-weight:700;font-size:12.5px;padding:5px 9px;border-radius:999px;min-width:34px;cursor:pointer;line-height:1.1}
.lang button.on{background:#fff;color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border-radius:20px;padding:18px 16px;margin:0 0 14px;box-shadow:0 1px 0 var(--line),0 10px 28px rgba(20,33,61,.06)}
h1,h2,h3{margin:0 0 10px;line-height:1.25;font-weight:700}h1{font-size:22px}h2{font-size:19px;color:var(--blue)}h3{font-size:16px;color:var(--blue)}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#ff6a1f,#ff5a0a);color:#fff;min-height:48px;text-decoration:none;box-shadow:0 4px 12px rgba(255,90,10,.25)}
.btn.blue{background:linear-gradient(180deg,#1047a8,#0b3a8f);box-shadow:0 4px 12px rgba(11,58,143,.22)}.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}.btn.green{background:var(--ok);box-shadow:none}.btn.red{background:var(--bad);box-shadow:none}.btn.wa{background:#1fa855;box-shadow:0 4px 12px rgba(31,168,85,.22)}
.btn.block{width:100%}.btn:disabled{opacity:.5}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:14px;box-shadow:none}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:15px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(14,75,181,.15)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;color:var(--ink);min-height:48px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}.chips button{flex:0 0 auto;min-height:40px;padding:6px 14px;border-radius:999px;white-space:nowrap;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600}.chk input{width:24px;height:24px;min-height:0;flex:0 0 auto}
.err{background:#fde8e8;color:#991b1b;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.okmsg{background:#e7f6ec;color:#14532d;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding:4px 4px env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(20,33,61,.06)}
.tabs button{flex:1;border:0;background:none;padding:6px 2px 8px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs button span.ic{display:grid;place-items:center;width:46px;height:28px;border-radius:999px}
.tabs button.on{color:var(--blue)}.tabs button.on span.ic{background:#e6eeff}.tabs svg{width:22px;height:22px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;min-width:68px;text-align:center;font-weight:700;color:var(--ink)}
.days button small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.days button.on{background:var(--blue);border-color:var(--blue);color:#fff}.days button.on small{color:#dbe6ff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.slot{border:1.5px solid #bfe3c9;background:#effaf2;border-radius:12px;padding:10px 6px;text-align:center;font-weight:700;color:#14532d;min-height:52px}
.slot.no{background:#f3f3f3;border-color:#e3e3e3;color:#9aa0ab;font-weight:600}
.slot.sel{background:var(--orange);border-color:var(--orange);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#f1efe8}
.pill.g{background:#e7f6ec;color:#166534}.pill.o{background:#fff1e6;color:#c2410c}.pill.b{background:#e6eeff;color:var(--blue)}.pill.r{background:#fde8e8;color:#991b1b}.pill.y{background:#fff7d6;color:#854d0e}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#ece8dc 0);display:grid;place-items:center;flex:0 0 auto}
.ring div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:Sora,'Hind Siliguri',sans-serif;font-weight:800;font-size:18px;color:var(--blue)}
.flex{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.qr{background:#fff;border-radius:16px;padding:10px;display:inline-block;border:3px solid var(--yellow);box-shadow:0 6px 18px rgba(255,197,20,.25)}
.qr img,.qr svg{display:block;width:200px;height:200px;image-rendering:pixelated}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.av{width:44px;height:44px;border-radius:50%;background:#e6eeff;display:grid;place-items:center;font-weight:700;color:var(--blue);overflow:hidden;flex:0 0 auto}.av img{width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(20,33,61,.04);border-top:3px solid var(--yellow)}
.kpi b{display:block;font-family:Sora,'Hind Siliguri',sans-serif;font-size:22px}.kpi span{color:var(--mut);font-size:13px}
.daygrid{width:100%;border-collapse:collapse;font-size:14px}.daygrid td,.daygrid th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.cell{border-radius:10px;padding:6px 8px;font-weight:600;min-height:38px;cursor:pointer}
.cell.free{background:#effaf2;color:#166534;border:1px dashed #9fd8b0}.cell.bk{background:#e6eeff;color:var(--blue)}.cell.att{background:#e7f6ec;color:#14532d}.cell.blk{background:#f1f1f1;color:#888}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.photo-prev{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#f3f3f3;margin-top:8px}
video{width:100%;border-radius:16px;background:#000;max-height:60vh}
.center{text-align:center}.mt{margin-top:12px}.mt2{margin-top:20px}.hide{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.big{font-size:28px;font-family:Sora,'Hind Siliguri',sans-serif;font-weight:800}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hero{text-align:center;padding:26px 16px 20px;background:linear-gradient(180deg,#fff 0%,#fffaf0 100%);border:1.5px solid #f6e3a6}
.hero img{height:84px;width:auto}.hero h1{margin:10px 0 2px;color:var(--blue)}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:360px){.brand img.word{height:17px}.brand img.shield{height:34px}.lang button{padding:5px 7px;min-width:30px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const API = new URLSearchParams(location.search).get('api') || 'https://wzesyetbiyxdgjyuhqoz.supabase.co/functions/v1/book';
const PHONE = '9748481630', PHONE_TXT = '97484 81630';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- language (each person picks; terms like বুকিং / স্লট / QR / PIN / স্কুটি stay as people say them)
let LANG = (() => { try { const v = localStorage.getItem('s2w_lang'); return ['bn', 'en', 'hi'].includes(v) ? v : 'bn'; } catch (e) { return 'bn'; } })();
const L = (bn, en, hi) => (LANG === 'en' ? en : LANG === 'hi' ? hi : bn);
const N = (n) => (LANG === 'bn' ? String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]) : String(n));
let RERENDER = () => {};
function setLang(l) { LANG = l; try { localStorage.setItem('s2w_lang', l); } catch (e) {} document.documentElement.lang = l; RERENDER(); }
document.documentElement.lang = LANG;
document.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b && b.dataset.lang !== LANG) setLang(b.dataset.lang); });

const money = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const IST = 330 * 60000;
const istParts = (iso) => { const d = new Date(Date.parse(iso) + IST); return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), m: d.getUTCMinutes(), wd: d.getUTCDay() }; };
const WD = () => L(['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহস্পতি', 'শুক্র', 'শনি'], ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], ['रवि', 'सोम', 'मंगल', 'बुध', 'गुरु', 'शुक्र', 'शनि']);
const MO = () => L(['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'], ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], ['जन', 'फ़र', 'मार्च', 'अप्रै', 'मई', 'जून', 'जुला', 'अग', 'सित', 'अक्टू', 'नव', 'दिस']);
function tTime(iso) {
  const p = istParts(iso); const h = p.h % 12 || 12; const hm = `${N(h)}:${N(String(p.m).padStart(2, '0'))}`;
  if (LANG === 'en') return `${hm} ${p.h < 12 ? 'am' : 'pm'}`;
  if (LANG === 'hi') return `${p.h < 12 ? 'सुबह' : p.h < 16 ? 'दोपहर' : 'शाम'} ${hm}`;
  return `${hm} ${p.h < 12 ? 'সকাল' : p.h < 16 ? 'দুপুর' : p.h < 18 ? 'বিকেল' : 'সন্ধ্যা'}`;
}
function tDay(iso) { const p = istParts(iso); return `${WD()[p.wd]}, ${N(p.d)} ${MO()[p.mo]}`; }
function istToday(off = 0) { return new Date(Date.now() + IST + off * 864e5).toISOString().slice(0, 10); }
function dayLabel(ds) { const d = new Date(ds + 'T00:00:00Z'); return { wd: WD()[d.getUTCDay()], d: N(d.getUTCDate()) + ' ' + MO()[d.getUTCMonth()] }; }
const dDay = (ds) => (ds ? tDay(ds + 'T06:00:00Z') : '');
const validTxt = (till) => L(`মেয়াদ ${dDay(till)} পর্যন্ত`, `Valid till ${dDay(till)}`, `${dDay(till)} तक वैध`);
const kindName = (k) => (k === 'bike' ? L('বাইক', 'Bike', 'बाइक') : L('স্কুটি', 'Scooty', 'स्कूटी'));
function toast(msg) { document.querySelectorAll('.toast').forEach((x) => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function api(action, body = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, lang: LANG, ...body }) });
  const j = await r.json().catch(() => ({ error: L('নেটওয়ার্কে সমস্যা', 'Network problem', 'नेटवर्क में दिक्कत') }));
  if (!r.ok) { const e = new Error(j.error || L('সমস্যা হয়েছে', 'Something went wrong', 'कुछ गड़बड़ हुई')); e.status = r.status; e.data = j; throw e; }
  return j;
}
function qrSvg(text, size = 200) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: Math.max(2, Math.floor(size / (q.getModuleCount() + 8))), margin: 4, scalable: true }); }
function compress(file, max = 1080, quality = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => rej(new Error(L('ছবিটা খোলা গেল না', 'Couldn’t open the photo', 'फ़ोटो खुल नहीं पाई'))); img.src = url;
  });
}
function stack(a, b) { // front + back of a card in one picture
  return new Promise((res) => { const i1 = new Image(), i2 = new Image(); let n = 0; const go = () => { if (++n < 2) return; const w = Math.min(1080, Math.max(i1.width, i2.width)); const h1 = i1.height * w / i1.width, h2 = i2.height * w / i2.width; const c = document.createElement('canvas'); c.width = w; c.height = h1 + h2 + 12; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(i1, 0, 0, w, h1); x.drawImage(i2, 0, h1 + 12, w, h2); res(c.toDataURL('image/jpeg', 0.75)); }; i1.onload = go; i2.onload = go; i1.src = a; i2.src = b; });
}
const waLink = (phone, text) => `https://wa.me/91${String(phone).replace(/\D/g, '').slice(-10)}?text=${encodeURIComponent(text)}`;
const studentUrl = (token) => `${location.origin}/app/?s=${token}`;
const PATULI = () => L('পাটুলি', 'Patuli', 'पाटुली');
function header(title, sub = '') {
  return `<div class="top"><div class="row"><div class="brand"><img class="shield" src="/assets/img/logo-shield-s.webp" alt="" width="36" height="40"><div style="min-width:0"><img class="word" src="/assets/img/logo-wordmark-s.webp" alt="Seekho 2 Wheeler" width="80" height="20"><div class="sub"><b>${esc(title)}</b>${sub ? ' · ' + esc(sub) : ''}</div></div></div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="bn" class="${LANG === 'bn' ? 'on' : ''}">বাং</button><button data-lang="en" class="${LANG === 'en' ? 'on' : ''}">EN</button><button data-lang="hi" class="${LANG === 'hi' ? 'on' : ''}">हि</button></div></div></div>`;
}
const ICON = {
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M7 12h10"/></svg>',
  add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  ppl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-2-5-4-5.6"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
};
const params = new URLSearchParams(location.search);
const app = $('#app');
const callBtn = (cls = 'btn blue') => `<a class="${cls}" href="tel:${PHONE}">${L('ফোন করুন', 'Call', 'फ़ोन करें')} ${PHONE_TXT}</a>`;

// =========================================================== STUDENT
async function studentPage(token) {
  let me, date = istToday(1), sel = null;
  RERENDER = () => { if (me) { render(); if (me.student.status === 'active' && !me.student.inactive && !me.student.expired) loadSlots(); } else studentPage(token); };
  async function load() { me = await api('me', { token }); render(); if (me.student.status === 'active' && !me.student.inactive && !me.student.expired) loadSlots(); }
  function render() {
    const s = me.student, pct = Math.round(100 * s.classes_done / s.package);
    const left = s.package - s.classes_done, B = me.branch;
    app.innerHTML = header(B.slug === 'patuli' ? PATULI() : B.name, L('আমার ক্লাস', 'My classes', 'मेरी क्लास')) + `<div class="wrap">
      <div class="card flex"><div class="ring" style="--p:${pct}"><div>${N(s.classes_done)}/${N(s.package)}</div></div>

        `हफ़्ते में 2 क्लास · पिछली क्लास के 48 घंटे बाद अगली · बुकिंग क्लास से ${B.window_hours} घंटे पहले खुलती है, ${B.lead_hours} घंटे पहले तक बुक कर सकते हैं · ${B.cancel_hours} घंटे पहले तक कैंसल${s.valid_till ? ` · एडमिशन के ${B.valid_days} दिन के अंदर सारी क्लास` : ''}`)}</div>

      ${me.history.length ? `<div class="card"><h3>${L('আগের ক্লাস', 'Past classes', 'पिछली क्लास')}</h3><div class="list">${me.history.map((h) => `<div class="it"><div style="flex:1">${tDay(h.slot)} · ${tTime(h.slot)}</div>${{ attended: `<span class="pill g">${L('হয়েছে', 'Done', 'हो गई')}</span>`, no_show: `<span class="pill y">${L('আসেননি', 'Missed', 'नहीं आए')}</span>`, cancelled: `<span class="pill">${L('বাতিল', 'Cancelled', 'कैंसल')}</span>`, cancelled_centre: `<span class="pill r">${L('সেন্টার বাতিল করেছে', 'Cancelled by centre', 'सेंटर ने कैंसल किया')}</span>` }[h.status] || ''}</div>`).join('')}</div></div>` : ''}
      <div class="card"><div class="mut">${L('অনলাইনে বুক করতে অসুবিধা হলে ফোন করুন, আমরা বুক করে দেব।', 'Trouble booking online? Call us and we’ll book it for you.', 'ऑनलाइन बुक करने में दिक्कत हो तो फ़ोन करें, हम बुक कर देंगे।')}</div><a class="btn wa block mt" href="tel:${PHONE}">📞 ${PHONE_TXT}</a></div>
    </div>`;
    app.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => { if (!confirm(L('ক্লাসটা বাতিল করবেন?', 'Cancel this class?', 'यह क्लास कैंसल करें?'))) return; try { me = await api('cancel', { token, booking: b.dataset.cancel }); render(); loadSlots(); toast(L('বাতিল হয়েছে', 'Cancelled', 'कैंसल हो गई')); } catch (e) { toast(e.message); } });
    if ($('#react')) $('#react').onclick = async () => { try { me = await api('reactivate_request', { token }); render(); } catch (e) { toast(e.message); } };
    const days = $('#days'); if (days) { days.innerHTML = Array.from({ length: Math.ceil(B.window_hours / 24) + 1 }, (_, i) => istToday(i)).map((d) => { const l = dayLabel(d); return `<button data-d="${d}" class="${d === date ? 'on' : ''}">${l.wd}<small>${l.d}</small></button>`; }).join(''); days.querySelectorAll('button').forEach((b) => b.onclick = () => { date = b.dataset.d; sel = null; days.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); loadSlots(); }); }
  }
  async function loadSlots() {
    const box = $('#slots'); if (!box) return; box.innerHTML = `<div class="mut mt">${L('লোড হচ্ছে…', 'Loading…', 'लोड हो रहा है…')}</div>`; $('#bookbar').innerHTML = '';
    try {
      const r = await api('slots', { token, date });
      const free = r.slots.filter((x) => x.ok);
      box.innerHTML = `<div class="slots">${r.slots.map((x) => `<button class="slot ${x.ok ? '' : 'no'}" data-s="${x.slot}" data-why="${esc(x.text)}">${tTime(x.slot)}</button>`).join('')}</div>
        ${free.length ? '' : `<div class="mut mt">${esc((r.slots.find((x) => !x.ok) || {}).text || L('এই দিনে ফাঁকা নেই', 'Nothing free on this day', 'इस दिन कुछ खाली नहीं'))}</div>`}`;
      box.querySelectorAll('.slot').forEach((b) => b.onclick = () => {
        if (b.classList.contains('no')) { toast(b.dataset.why || L('এই সময় পাওয়া যাবে না', 'This time isn’t available', 'यह समय नहीं मिलेगा')); return; }
        sel = b.dataset.s; box.querySelectorAll('.slot').forEach((x) => x.classList.toggle('sel', x === b));
        $('#bookbar').innerHTML = `<button class="btn block mt" id="go">${L(`${tDay(sel)} · ${tTime(sel)} বুক করুন`, `Book ${tDay(sel)} · ${tTime(sel)}`, `${tDay(sel)} · ${tTime(sel)} बुक करें`)}</button>`;
        $('#go').onclick = async () => { $('#go').disabled = true; try { me = await api('book', { token, slot: sel }); sel = null; render(); loadSlots(); toast(L('বুক হয়ে গেছে ✓', 'Booked ✓', 'बुक हो गई ✓')); window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { toast(e.message); loadSlots(); } };
      });
    } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  try { await load(); } catch (e) { app.innerHTML = header(L('ক্লাস বুকিং', 'Class booking', 'क्लास बुकिंग')) + `<div class="wrap"><div class="card"><div class="err">${esc(e.message)}</div>${callBtn()}</div></div>`; }
}

      try { const card = await stack(front, back); const r = await api('old_submit', { branch, name, phone, card }); location.href = `/app/?s=${r.token}` + (params.get('api') ? `&api=${encodeURIComponent(params.get('api'))}` : ''); }

    };
  };
  RERENDER = draw; draw();

let tab = 'scan';
function staffHome() {
  RERENDER = () => { stopCam(); document.querySelectorAll('.modal').forEach((m) => m.remove()); staffHome(); };
  const P = S.role === 'admin' ? { dashboard: 1, students: 1, bookings: 1, money: 1 } : (S.perms || {});
  const tabs = [['scan', L('স্ক্যান', 'Scan', 'स्कैन'), ICON.scan], ['admit', L('ভর্তি', 'Admit', 'एडमिशन'), ICON.add]];
  if (P.bookings) tabs.push(['day', L('বুকিং', 'Bookings', 'बुकिंग'), ICON.cal]);
  if (P.students) tabs.push(['students', L('শিক্ষার্থী', 'Students', 'स्टूडेंट'), ICON.ppl]);
  if (P.dashboard) tabs.push(['dash', L('হিসাব', 'Accounts', 'हिसाब'), ICON.chart]);
  if (S.role === 'admin') tabs.push(['settings', L('সেটিংস', 'Settings', 'सेटिंग्स'), ICON.gear]);
  if (!tabs.find((t) => t[0] === tab)) tab = 'scan';
  app.innerHTML = header(S.branch.slug === 'patuli' ? PATULI() : S.branch.name, S.role === 'admin' ? L('অ্যাডমিন', 'Admin', 'एडमिन') : L('ট্রেনার', 'Trainer', 'ट्रेनर')) + `<div class="wrap" id="main"></div>
    <nav class="tabs">${tabs.map((t) => `<button data-t="${t[0]}" class="${t[0] === tab ? 'on' : ''}"><span class="ic">${t[2]}</span>${t[1]}</button>`).join('')}</nav>`;
  app.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { stopCam(); tab = b.dataset.t; staffHome(); });
  ({ scan: scanTab, admit: admitTab, day: dayTab, students: studentsTab, dash: dashTab, settings: settingsTab })[tab]($('#main'));
}

// ---------- scan
let camStream = null, camTimer = null;
function stopCam() { if (camTimer) cancelAnimationFrame(camTimer); camTimer = null; if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
async function loadJsQR() { if (window.jsQR) return; await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function scanTab(el) {
  el.innerHTML = `<div class="card"><h2>${L('QR স্ক্যান করে ক্লাস গুনুন', 'Scan the QR to count the class', 'QR स्कैन करके क्लास गिनें')}</h2><video id="v" playsinline muted class="hide"></video>
    <button class="btn blue block mt" id="cam">📷 ${L('ক্যামেরা চালু করুন', 'Turn on camera', 'कैमरा चालू करें')}</button>
    <label>${L('অথবা কোড লিখুন', 'Or type the code', 'या कोड लिखें')}</label><div class="flex"><input id="code" placeholder="S2W-XXXXXX" autocapitalize="characters"><button class="btn sm" id="sub">${L('দেখুন', 'Check', 'देखें')}</button></div>
    <div id="res"></div></div>`;
  const handle = async (code, force = false) => {
    stopCam(); $('#v').classList.add('hide');
    const box = $('#res'); box.innerHTML = `<div class="mut mt">${L('মিলিয়ে দেখা হচ্ছে…', 'Checking…', 'जाँच हो रही है…')}</div>`;
    try {
      const r = await sapi('scan', { qr: code, force });
      const cnt = `${N(r.done)}/${N(r.package)}`;
      if (r.ok) box.innerHTML = `<div class="okmsg">✓ ${esc(r.name)}: ${L('ক্লাস গোনা হলো', 'class counted', 'क्लास गिनी गई')} (${cnt})${r.walk_in ? ' · ' + L('বুকিং ছাড়া', 'without booking', 'बिना बुकिंग') : ''}</div>`;
      else if (r.reason === 'no_booking') { box.innerHTML = `<div class="err">${L(`${esc(r.name)}-এর এখন কোনো বুকিং নেই (${cnt})।`, `${esc(r.name)} has no booking now (${cnt}).`, `${esc(r.name)} की अभी कोई बुकिंग नहीं है (${cnt})।`)}</div><button class="btn block" id="force">${L('স্কুটি ফাঁকা থাকলে তবু ক্লাস দিন', 'Give the class anyway if a scooty is free', 'स्कूटी खाली हो तो फिर भी क्लास दें')}</button>`; $('#force').onclick = () => handle(code, true); }
      else box.innerHTML = `<div class="err">${esc(r.name ? r.name + ': ' : '')}${{ unknown_qr: L('এই QR চেনা যাচ্ছে না', 'This QR isn’t recognised', 'यह QR पहचाना नहीं गया'), already_today: L('আজকের ক্লাস আগেই গোনা হয়েছে', 'Today’s class is already counted', 'आज की क्लास पहले ही गिनी जा चुकी है'), package_used: L('সব ক্লাস শেষ', 'All classes used', 'सारी क्लास पूरी'), pending: L('এখনো অনুমোদন হয়নি (শিক্ষার্থী তালিকায় অনুমোদন দিন)', 'Not approved yet (approve in the students list)', 'अभी अप्रूव नहीं हुआ (स्टूडेंट लिस्ट में अप्रूव करें)'), not_active: L('এই শিক্ষার্থী এখন চালু নেই', 'This student is not active', 'यह स्टूडेंट अभी चालू नहीं है'), full: L('সব স্কুটি এখন বুক', 'All scooties are booked now', 'सारी स्कूटी अभी बुक हैं'), expired: L('ভর্তির মেয়াদ শেষ (অ্যাডমিন মেয়াদ বাড়াতে পারবেন)', 'Validity from admission is over (the admin can extend it)', 'एडमिशन की वैधता ख़त्म (एडमिन बढ़ा सकते हैं)') }[r.reason] || r.reason}</div>`;
    } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $('#sub').onclick = () => handle($('#code').value.trim().toUpperCase());
  $('#cam').onclick = async () => {
    try {
      await loadJsQR();
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#v'); v.srcObject = camStream; v.classList.remove('hide'); await v.play();
      const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
      const tick = () => { if (!camStream) return; if (v.readyState === 4) { c.width = v.videoWidth; c.height = v.videoHeight; x.drawImage(v, 0, 0); const d = x.getImageData(0, 0, c.width, c.height); const q = window.jsQR(d.data, c.width, c.height); if (q && q.data) { navigator.vibrate?.(80); return handle(q.data.trim()); } } camTimer = requestAnimationFrame(tick); };
      tick();
    } catch (e) { toast(L('ক্যামেরা চালু হলো না। কোড লিখে দিন।', 'Camera didn’t start. Type the code instead.', 'कैमरा चालू नहीं हुआ। कोड लिख दें।')); }
  };
}

    <div id="idbox" class="hide"><input type="file" accept="image/*" capture="environment" id="ph2"><div class="mut">${L('ছবি থেকে শুধু শেষ ৪টে সংখ্যা রাখা হবে, ছবিটা রাখা হবে না।', 'Only the last 4 digits are kept from the photo; the photo itself is not stored.', 'फ़ोटो से सिर्फ़ आख़िरी 4 अंक रखे जाएँगे, फ़ोटो नहीं रखी जाएगी।')}</div></div>

// ---------- day view
let dayDate = istToday();
async function dayTab(el) {
  el.innerHTML = `<div class="card"><div class="days" id="dd"></div></div><div id="grid"><div class="mut">${L('লোড হচ্ছে…', 'Loading…', 'लोड हो रहा है…')}</div></div>`;
  const dd = $('#dd'); dd.innerHTML = Array.from({ length: 10 }, (_, i) => istToday(i - 1)).map((d) => { const l = dayLabel(d); return `<button data-d="${d}" class="${d === dayDate ? 'on' : ''}">${l.wd}<small>${l.d}</small></button>`; }).join('');
  dd.querySelectorAll('button').forEach((b) => b.onclick = () => { dayDate = b.dataset.d; dayTab(el); });
  try {
    const r = await sapi('today', { date: dayDate });
    const veh = r.vehicles.filter((v) => v.active);
    const isBlocked = (s) => r.blocks.some((b) => Date.parse(s) >= Date.parse(b.starts) && Date.parse(s) < Date.parse(b.ends));
    const at = (s, vid) => r.bookings.find((b) => b.slot_start && Date.parse(b.slot_start) === Date.parse(s) && b.vehicle_id === vid && ['booked', 'attended'].includes(b.status));
    const n = r.bookings.filter((b) => ['booked', 'attended'].includes(b.status)).length;
    const W = { free: L('ফাঁকা', 'Free', 'खाली'), bk: L('বুক', 'Booked', 'बुक'), att: L('এসেছেন', 'Came', 'आए'), off: L('বন্ধ', 'Closed', 'बंद') };
    $('#grid').innerHTML = `<div class="card"><div class="flex between"><h2>${tDay(dayDate + 'T06:00:00Z')}</h2><span class="pill b">${N(n)}/${N(r.slots.length * veh.length)} ${W.bk}</span></div>
      ${S.role === 'admin' ? `<div class="flex wrapf mt"><button class="btn ghost sm" id="blkday">${L('পুরো দিন বন্ধ', 'Close whole day', 'पूरा दिन बंद')}</button><button class="btn ghost sm" id="blkam">${L('সকাল বন্ধ', 'Close morning', 'सुबह बंद')}</button><button class="btn ghost sm" id="blkpm">${L('বিকেল বন্ধ', 'Close afternoon', 'दोपहर बाद बंद')}</button></div>` : ''}
      ${r.blocks.map((b) => `<div class="err mt">${W.off}: ${tTime(b.starts)} – ${tTime(b.ends)} ${esc(b.reason)} ${S.role === 'admin' ? `<button class="btn sm ghost" data-unblock="${b.id}">${L('খুলুন', 'Open', 'खोलें')}</button>` : ''}</div>`).join('')}
      <table class="daygrid mt"><tr><th>${L('সময়', 'Time', 'समय')}</th>${veh.map((v) => `<th>${esc(v.label)}</th>`).join('')}</tr>
      ${r.slots.map((s) => `<tr><td style="white-space:nowrap">${tTime(s)}</td>${veh.map((v) => { const b = at(s, v.id); if (isBlocked(s)) return `<td><div class="cell blk">${W.off}</div></td>`; if (!b) return `<td><div class="cell free" data-free="${s}">${W.free}</div></td>`; return `<td><div class="cell ${b.status === 'attended' ? 'att' : 'bk'}" data-bk="${b.id}" data-st="${b.status}">${esc(b.name)}<div style="font-weight:500;font-size:12px">${b.status === 'attended' ? '✓ ' + W.att : esc(b.phone)}</div></div></td>`; }).join('')}</tr>`).join('')}</table>
      <div class="legend mt"><span><i style="background:#effaf2;border:1px dashed #9fd8b0"></i>${W.free}</span><span><i style="background:#e6eeff"></i>${W.bk}</span><span><i style="background:#e7f6ec"></i>${W.att}</span><span><i style="background:#f1f1f1"></i>${W.off}</span></div></div>`;
    const askReason = (def = '') => prompt(L('কারণ (যেমন: পুজোর ছুটি)', 'Reason (e.g. Puja holiday)', 'कारण (जैसे: पूजा की छुट्टी)'), def) ?? '';
    const blk = async (a, b, why) => { const reason = askReason(why); const st = new Date(Date.parse(`${dayDate}T${a}:00Z`) - IST).toISOString(), en = new Date(Date.parse(`${dayDate}T${b}:00Z`) - IST).toISOString(); try { const x = await sapi('block', { starts: st, ends: en, reason }); if (x.ok === false) { alert(L('এই সময়ে বুকিং আছে। আগে এগুলো বাতিল করুন:', 'There are bookings in this time. Cancel these first:', 'इस समय बुकिंग है। पहले इन्हें कैंसल करें:') + '\n' + x.clash.map((c) => `${tTime(c.slot_start)} ${c.name} (${c.phone})`).join('\n')); return; } toast(L('বন্ধ করা হলো', 'Closed', 'बंद कर दिया')); dayTab(el); } catch (e) { toast(e.message); } };
    if ($('#blkday')) { $('#blkday').onclick = () => blk('00:00', '23:59', L('ছুটি', 'Holiday', 'छुट्टी')); $('#blkam').onclick = () => blk('06:00', '13:00', ''); $('#blkpm').onclick = () => blk('13:00', '22:00', ''); }
    el.querySelectorAll('[data-unblock]').forEach((b) => b.onclick = async () => { await sapi('unblock', { id: b.dataset.unblock }); dayTab(el); });
    el.querySelectorAll('[data-bk]').forEach((c) => c.onclick = async () => {
      if (S.role !== 'admin' || c.dataset.st !== 'booked') return toast(c.textContent.trim());
      if (!confirm(L('এই বুকিং সেন্টার থেকে বাতিল করবেন? শিক্ষার্থীর লিংকে "সেন্টার বাতিল করেছে" দেখাবে।', 'Cancel this booking from the centre? The student’s link will show “Cancelled by centre”.', 'यह बुकिंग सेंटर की तरफ़ से कैंसल करें? स्टूडेंट के लिंक पर "सेंटर ने कैंसल किया" दिखेगा।'))) return;
      try { await sapi('staff_cancel', { booking: c.dataset.bk, reason: prompt(L('কারণ', 'Reason', 'कारण')) || '' }); toast(L('বাতিল হলো', 'Cancelled', 'कैंसल हो गई')); dayTab(el); } catch (e) { toast(e.message); }
    });
    const bookCell = (c) => pickStudent(async (s) => {

function bookFor(s, done) {
  let date = istToday(); const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h2>${L(`${esc(s.name)}-এর জন্য বুক`, `Book for ${esc(s.name)}`, `${esc(s.name)} के लिए बुक`)}</h2><div class="days" id="bd"></div>${S.role === 'admin' ? `<div class="chk"><input type="checkbox" id="frc"><span>${L('নিয়ম ছাড়াই বুক (অ্যাডমিন)', 'Book without the rules (admin)', 'नियम के बिना बुक (एडमिन)')}</span></div>` : ''}<div id="bs"></div><button class="btn ghost block mt" id="x">${L('বন্ধ', 'Close', 'बंद')}</button></div>`;
  document.body.appendChild(m); $('#x', m).onclick = () => m.remove();
  const days = () => { $('#bd', m).innerHTML = Array.from({ length: 8 }, (_, i) => istToday(i)).map((d) => { const l = dayLabel(d); return `<button data-d="${d}" class="${d === date ? 'on' : ''}">${l.wd}<small>${l.d}</small></button>`; }).join(''); $('#bd', m).querySelectorAll('button').forEach((b) => b.onclick = () => { date = b.dataset.d; days(); load(); }); };
  const load = async () => { const force = $('#frc', m)?.checked; const r = await sapi('staff_slots', { id: s.id, date, force }); $('#bs', m).innerHTML = `<div class="slots">${r.slots.map((x) => `<button class="slot ${x.ok ? '' : 'no'}" data-s="${x.slot}" data-why="${esc(x.text)}">${tTime(x.slot)}</button>`).join('')}</div>`; $('#bs', m).querySelectorAll('.slot').forEach((b) => b.onclick = async () => { if (b.classList.contains('no')) return toast(b.dataset.why); try { await sapi('staff_book', { id: s.id, slot: b.dataset.s, force }); toast(L('বুক হলো', 'Booked', 'बुक हो गई')); m.remove(); done(); } catch (e) { toast(e.message); } }); };
  if ($('#frc', m)) $('#frc', m).onchange = load; days(); load();
}

function bars(data) {
  const max = Math.max(1, ...data.map((d) => d.v)); const w = 320, h = 160, bw = w / Math.max(1, data.length), rw = Math.min(46, bw - 12);
  return `<svg viewBox="0 0 ${w} ${h + 26}" width="100%" role="img">${data.map((d, i) => { const bh = Math.round((h - 18) * d.v / max); return `<rect x="${i * bw + (bw - rw) / 2}" y="${h - bh}" width="${rw}" height="${bh}" rx="5" fill="${i === data.length - 1 ? '#ff5a0a' : '#0b3a8f'}"/><text x="${i * bw + bw / 2}" y="${h - bh - 4}" font-size="10" text-anchor="middle" fill="#14213d">${d.v >= 1000 ? Math.round(d.v / 1000) + 'k' : d.v}</text><text x="${i * bw + bw / 2}" y="${h + 16}" font-size="10" text-anchor="middle" fill="#5b6478">${esc(d.l)}</text>`; }).join('')}</svg>`;
}
function pie(parts) {
  const tot = parts.reduce((t, p) => t + p.v, 0) || 1; let a = -Math.PI / 2; const R = 60, c = 70;
  const segs = parts.filter((p) => p.v > 0).map((p) => { const a2 = a + 2 * Math.PI * p.v / tot; const large = a2 - a > Math.PI ? 1 : 0; const d = parts.filter((x) => x.v > 0).length === 1 ? `M${c} ${c - R}A${R} ${R} 0 1 1 ${c - 0.01} ${c - R}Z` : `M${c} ${c}L${c + R * Math.cos(a)} ${c + R * Math.sin(a)}A${R} ${R} 0 ${large} 1 ${c + R * Math.cos(a2)} ${c + R * Math.sin(a2)}Z`; a = a2; return `<path d="${d}" fill="${p.c}"/>`; }).join('');
  return `<div class="flex"><svg viewBox="0 0 140 140" width="120">${segs}<circle cx="70" cy="70" r="30" fill="#fff"/></svg><div>${parts.map((p) => `<div><span class="legend"><span><i style="background:${p.c}"></i>${esc(p.l)}: <b>${p.fmt ? p.fmt(p.v) : N(p.v)}</b></span></span></div>`).join('')}</div></div>`;
}
