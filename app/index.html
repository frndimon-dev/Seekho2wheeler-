function compress(file, max = 1080, quality = 0.72) {

    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => rej(new Error(L('ছবিটা খোলা গেল না', 'Couldn’t open the photo', 'फ़ोटो खुल नहीं पाई'))); img.src = url;
  });

  return new Promise((res) => { const i1 = new Image(), i2 = new Image(); let n = 0; const go = () => { if (++n < 2) return; const w = Math.min(1080, Math.max(i1.width, i2.width)); const h1 = i1.height * w / i1.width, h2 = i2.height * w / i2.width; const c = document.createElement('canvas'); c.width = w; c.height = h1 + h2 + 12; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(i1, 0, 0, w, h1); x.drawImage(i2, 0, h1 + 12, w, h2); res(c.toDataURL('image/jpeg', 0.75)); }; i1.onload = go; i2.onload = go; i1.src = a; i2.src = b; });

      ${s.status === 'deleted' ? '' : `<div class="card center"><h2>${L('ক্লাসে এসে এই QR দেখান', 'Show this QR at your class', 'क्लास में आकर यह QR दिखाएँ')}</h2><div class="qr">${qrSvg(s.qr)}</div><div class="mut mt">${esc(s.qr)}</div></div>`}
      ${me.history.length ? `<div class="card"><h3>${L('আগের ক্লাস', 'Past classes', 'पिछली क्लास')}</h3><div class="list">${me.history.map((h) => `<div class="it"><div style="flex:1">${tDay(h.slot)} · ${tTime(h.slot)}</div>${{ attended: `<span class="pill g">${L('হয়েছে', 'Done', 'हो गई')}</span>`, no_show: `<span class="pill y">${L('আসেননি', 'Missed', 'नहीं आए')}</span>`, cancelled: `<span class="pill">${L('বাতিল', 'Cancelled', 'कैंसल')}</span>`, cancelled_centre: `<span class="pill r">${L('সেন্টার বাতিল করেছে', 'Cancelled by centre', 'सेंटर ने कैंसल किया')}${h.note && h.note !== 'deleted' ? ' · ' + esc(h.note) : ''}</span>` }[h.status] || ''}</div>`).join('')}</div></div>` : ''}
      <div class="center mt"><a class="mut" href="/app/?old=${encodeURIComponent(B.slug)}&new=1" id="notme">${L('অন্য কেউ এই ফোন থেকে যুক্ত হবেন? এখানে চাপুন', 'Someone else joining from this phone? Tap here', 'कोई और इस फ़ोन से जुड़ेगा? यहाँ दबाएँ')}</a></div>

    </div>`;
    app.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => { if (!confirm(L('ক্লাসটা বাতিল করবেন?', 'Cancel this class?', 'यह क्लास कैंसल करें?'))) return; try { me = await api('cancel', { token, booking: b.dataset.cancel }); render(); loadSlots(); toast(L('বাতিল হয়েছে', 'Cancelled', 'कैंसल हो गई')); } catch (e) { toast(e.message); } });

    if ($('#cl_go')) {
      let method = 'cash'; app.querySelectorAll('#cl_m button').forEach((b) => b.onclick = () => { method = b.dataset.v; app.querySelectorAll('#cl_m button').forEach((x) => x.classList.toggle('on', x === b)); });
      $('#cl_go').onclick = async () => { $('#cl_go').disabled = true; try { me = await api('pay_claim', { token, amount: $('#cl_amt').value, method }); render(); if ($('#bookcard')) loadSlots(); toast(L('জানানো হলো ✓', 'Sent ✓', 'बता दिया ✓')); } catch (e) { toast(e.message); $('#cl_go').disabled = false; } };
    }
    const days = $('#days'); if (days) { days.innerHTML = Array.from({ length: Math.ceil(B.window_hours / 24) + 1 }, (_, i) => istToday(i)).map((d) => { const l = dayLabel(d); return `<button data-d="${d}" class="${d === date ? 'on' : ''}">${l.wd}<small>${l.d}</small></button>`; }).join(''); days.querySelectorAll('button').forEach((b) => b.onclick = () => { date = b.dataset.d; sel = null; days.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); loadSlots(); }); }
  }
  async function loadSlots() {
    const box = $('#slots'); if (!box) return; box.innerHTML = `<div class="mut mt">${L('লোড হচ্ছে…', 'Loading…', 'लोड हो रहा है…')}</div>`; $('#bookbar').innerHTML = '';
    try {
      const r = await api('slots', { token, date });
      const free = r.slots.filter((x) => x.ok);
      box.innerHTML = `<div class="slots">${r.slots.map((x) => `<button class="slot ${x.ok ? '' : 'no'}" data-s="${x.slot}" data-why="${esc(x.text)}">${x.ok ? CI.ok : CI.lock}${tTime(x.slot)}</button>`).join('')}</div>
        ${free.length ? '' : `<div class="mut mt">${esc((r.slots.find((x) => !x.ok) || {}).text || L('এই দিনে ফাঁকা নেই', 'Nothing free on this day', 'इस दिन कुछ खाली नहीं'))}</div>`}`;
      box.querySelectorAll('.slot').forEach((b) => b.onclick = () => {
        if (b.classList.contains('no')) { toast(b.dataset.why || L('এই সময় পাওয়া যাবে না', 'This time isn’t available', 'यह समय नहीं मिलेगा')); return; }
        sel = b.dataset.s; box.querySelectorAll('.slot').forEach((x) => x.classList.toggle('sel', x === b));
        $('#bookbar').innerHTML = `<button class="btn block mt" id="go">${L(`${tDay(sel)} · ${tTime(sel)} বুক করুন`, `Book ${tDay(sel)} · ${tTime(sel)}`, `${tDay(sel)} · ${tTime(sel)} बुक करें`)}</button>`;
        $('#go').onclick = async () => { $('#go').disabled = true; try { me = await api('book', { token, slot: sel }); sel = null; render(); loadSlots(); toast(L('বুক হয়ে গেছে ✓', 'Booked ✓', 'बुक हो गई ✓')); window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { toast(e.message); loadSlots(); } };
      });
    } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  try { await load(); } catch (e) { app.innerHTML = header(L('ক্লাস বুকিং', 'Class booking', 'क्लास बुकिंग')) + `<div class="wrap"><div class="card"><div class="err">${esc(e.message)}</div>${callBtn()}</div></div>`; }
}

function oldPage(branch) {
  let front = '', back = '';
  const draw = () => {
    const keep = { nm: $('#nm')?.value || '', ph: $('#ph')?.value || '' };
    app.innerHTML = header(L('পুরোনো শিক্ষার্থী', 'Existing student', 'पुराने स्टूडेंट'), L('কার্ড দিয়ে যুক্ত হোন', 'Join with your card', 'कार्ड से जुड़ें')) + `<div class="wrap"><div class="card">
      <h1>${L('আপনার ভর্তির কার্ডের ছবি দিন', 'Add photos of your admission card', 'अपने एडमिशन कार्ड की फ़ोटो दें')}</h1><p class="mut">${L('কার্ড থেকে আপনার ক্লাস আর ফি-র হিসাব নিজে থেকে উঠে যাবে। ছবি পরিষ্কার হলে সঙ্গে সঙ্গে বুকিং খুলে যাবে।', 'Your classes and fees are read from the card automatically. If the photo is clear, booking opens right away.', 'कार्ड से आपकी क्लास और फीस का हिसाब अपने आप आ जाएगा। फ़ोटो साफ़ हो तो बुकिंग तुरंत खुल जाएगी।')}</p>
      <label>${L('আপনার নাম', 'Your name', 'आपका नाम')}</label><input id="nm" autocomplete="name" value="${esc(keep.nm)}">
      <label>${L('ফোন নম্বর', 'Phone number', 'फ़ोन नंबर')}</label><input id="ph" inputmode="numeric" maxlength="10" placeholder="${L('১০ সংখ্যার মোবাইল', '10-digit mobile', '10 अंकों का मोबाइल')}" value="${esc(keep.ph)}">
      <label>${L('কার্ডের সামনের দিক', 'Card front', 'कार्ड का आगे का हिस्सा')}</label><input type="file" accept="image/*" capture="environment" id="f1"><img id="p1" class="photo-prev ${front ? '' : 'hide'}" src="${front}">
      <label>${L('কার্ডের পেছনের দিক', 'Card back', 'कार्ड का पीछे का हिस्सा')}</label><input type="file" accept="image/*" capture="environment" id="f2"><img id="p2" class="photo-prev ${back ? '' : 'hide'}" src="${back}">
      <div id="msg"></div><button class="btn block mt2" id="go">${L('জমা দিন', 'Submit', 'जमा करें')}</button></div></div>`;
    const pick = (inp, img, set) => $(inp).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const d = await compress(f, 1400, 0.8); set(d); $(img).src = d; $(img).classList.remove('hide'); };
    pick('#f1', '#p1', (d) => front = d); pick('#f2', '#p2', (d) => back = d);
    const goMine = (t) => { saveMe(t); location.href = `/app/?s=${t}&reg=1` + (params.get('api') ? `&api=${encodeURIComponent(params.get('api'))}` : ''); };
    let lastAsk = '';
    const check = async () => {
      const name = $('#nm').value.trim(), phone = $('#ph').value.replace(/\D/g, '');
      if (name.length < 2 || phone.length !== 10 || lastAsk === name + phone) return; lastAsk = name + phone;
      try { const r = await api('find_me', { branch, name, phone });
        if (r.found) { $('#msg').innerHTML = `<div class="okmsg"><b>✅ ${L('আপনি আগেই রেজিস্টার করেছেন।', 'You are already registered.', 'आप पहले से रजिस्टर हैं।')}</b> ${L('কার্ডের ছবি আর দিতে হবে না, এখনই ক্লাস বুক করুন।', 'No need to add the card again. Book your class now.', 'कार्ड दोबारा देने की ज़रूरत नहीं, अभी क्लास बुक करें।')}</div><button class="btn green block mt" id="mine">${L('ক্লাস বুক করুন', 'Book your class', 'क्लास बुक करें')}</button>`; $('#mine').onclick = () => goMine(r.token); }
      } catch (e) {}
    };
    $('#nm').addEventListener('blur', check); $('#ph').addEventListener('input', check); $('#ph').addEventListener('blur', check);
    $('#go').onclick = async () => {
      const name = $('#nm').value.trim(), phone = $('#ph').value.replace(/\D/g, '');
      if (!name || phone.length !== 10) return $('#msg').innerHTML = `<div class="err">${L('নাম আর ১০ সংখ্যার ফোন নম্বর দিন।', 'Enter your name and a 10-digit phone number.', 'नाम और 10 अंकों का फ़ोन नंबर लिखें।')}</div>`;
      if (!front || !back) return $('#msg').innerHTML = `<div class="err">${L('কার্ডের দুই দিকের ছবি দিন।', 'Add photos of both sides of the card.', 'कार्ड के दोनों तरफ़ की फ़ोटो दें।')}</div>`;
      $('#go').disabled = true; $('#go').textContent = L('কার্ড পড়া হচ্ছে…', 'Reading the card…', 'कार्ड पढ़ा जा रहा है…');
      try { const card = await stack(front, back); const r = await api('old_submit', { branch, name, phone, card }); saveMe(r.token); location.href = `/app/?s=${r.token}` + (r.existing ? '&reg=1' : '') + (params.get('api') ? `&api=${encodeURIComponent(params.get('api'))}` : ''); }
      catch (e) { $('#msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#go').disabled = false; $('#go').textContent = L('জমা দিন', 'Submit', 'जमा करें'); }
    };
  };
  RERENDER = draw; draw();
}

let S = null; // {session, role, perms, branch}
function saveSession(s) { try { localStorage.setItem('s2w_staff', JSON.stringify(s)); } catch (e) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem('s2w_staff') || 'null'); } catch (e) { return null; } }
const sapi = (action, body = {}) => api(action, { session: S.session, ...body }).catch((e) => { if (e.status === 401) { saveSession(null); S = null; loginPage(); } throw e; });

let tab = 'scan';
function staffHome() {
  RERENDER = () => { stopCam(); document.querySelectorAll('.modal').forEach((m) => m.remove()); staffHome(); };
  const P = S.role === 'admin' ? { dashboard: 1, students: 1, bookings: 1, money: 1 } : (S.perms || {});
  const tabs = [['scan', L('স্ক্যান', 'Scan', 'स्कैन'), ICON.scan], ['admit', L('ভর্তি', 'Admit', 'एडमिशन'), ICON.add]];
  if (P.bookings) tabs.push(['day', L('বুকিং', 'Bookings', 'बुकिंग'), ICON.cal]);
  if (P.students) tabs.push(['students', L('শিক্ষার্থী', 'Students', 'स्टूडेंट'), ICON.ppl]);
  if (P.dashboard) tabs.push(['dash', L('হিসাব', 'Accounts', 'हिसाब'), ICON.chart]);
  if (S.role === 'admin') tabs.push(['settings', L('সেটিংস', 'Settings', 'सेटिंग्स'), ICON.gear]);
  if (!tabs.find((t) => t[0] === tab)) tab = 'scan';
  app.innerHTML = header(S.branch.slug === 'patuli' ? PATULI() : S.branch.name, S.role === 'admin' ? L('অ্যাডমিন', 'Admin', 'एडमिन') : L('ট্রেনার', 'Trainer', 'ट्रेनर'), true) + `<div class="wrap" id="main"></div>
    <nav class="tabs">${tabs.map((t) => `<button data-t="${t[0]}" class="${t[0] === tab ? 'on' : ''}"><span class="ic">${t[2]}</span>${t[1]}</button>`).join('')}</nav>`;
  app.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { stopCam(); tab = b.dataset.t; staffHome(); });
  $('#menu').onclick = staffMenu;
  ({ scan: scanTab, admit: admitTab, day: dayTab, students: studentsTab, dash: dashTab, settings: settingsTab })[tab]($('#main'));
}

      <a class="btn wa block mt" id="osend" target="_blank" rel="noopener" href="#">💬 ${L('WhatsApp-এ পাঠান', 'Send on WhatsApp', 'WhatsApp पर भेजें')}</a>
      <button class="btn ghost block mt" id="ocopy">${L('শুধু লিংক কপি করুন', 'Just copy the link', 'सिर्फ़ लिंक कॉपी करें')}</button></div>

  $('#lout', m).onclick = () => { if (!confirm(L('লগআউট করবেন?', 'Log out?', 'लॉगआउट करें?'))) return; stopCam(); m.remove(); saveSession(null); S = null; loginPage(); };

// ---------- scan
let camStream = null, camTimer = null;
function stopCam() { if (camTimer) cancelAnimationFrame(camTimer); camTimer = null; if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
async function loadJsQR() { if (window.jsQR) return; await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadClaims(box) {
  if (!box || !(S.role === 'admin' || (S.perms || {}).money)) return;
  try {
    const r = await sapi('claims'); if (!r.claims.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="card claim"><h3 style="margin-top:0">💵 ${L('টাকা মিলিয়ে নিন', 'Check these payments', 'ये पैसे मिला लें')}</h3><div class="mut">${L('এঁরা জানিয়েছেন টাকা দিয়েছেন। পেয়ে থাকলে জমা করুন, না পেলে "পাইনি" দিন।', 'These students say they have paid. Record it if you got it; otherwise press “Not received”.', 'इन्होंने बताया कि पैसे दे दिए। मिले हों तो जमा करें, नहीं तो "नहीं मिले" दबाएँ।')}</div>
      <div class="list mt">${r.claims.map((c) => `<div class="it" style="flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>${esc(c.name)}</b><div class="mut">${money(c.pay_claim.amount)} · ${methodTxt(c.pay_claim.method)} · ${tDay(c.pay_claim.at)} · ${L('বাকি', 'due', 'बाकी')} ${money(c.total_fee - c.paid)}</div></div>
        <button class="btn sm green" data-cy="${c.id}" data-amt="${c.pay_claim.amount}">✓ ${L('পেয়েছি, জমা', 'Got it, record', 'मिल गए, जमा')}</button><button class="btn sm ghost" data-cn="${c.id}">${L('পাইনি', 'Not received', 'नहीं मिले')}</button></div>`).join('')}</div></div>`;
    box.querySelectorAll('[data-cy]').forEach((b) => b.onclick = async () => { try { await sapi('payment', { id: b.dataset.cy, amount: b.dataset.amt }); toast(L('জমা হলো', 'Recorded', 'जमा हो गया')); loadClaims(box); } catch (e) { toast(e.message); } });
    box.querySelectorAll('[data-cn]').forEach((b) => b.onclick = async () => { if (!confirm(L('টাকা পাননি? শিক্ষার্থীর বুকিং আবার বন্ধ হয়ে যাবে।', 'Not received? The student’s booking will be locked again.', 'पैसे नहीं मिले? स्टूडेंट की बुकिंग फिर बंद हो जाएगी।'))) return; try { await sapi('pay_claim_no', { id: b.dataset.cn }); loadClaims(box); } catch (e) { toast(e.message); } });
  } catch (e) { box.innerHTML = ''; }
}
function scanTab(el) {
  el.innerHTML = `<div id="claims"></div><div class="card"><h2>${L('QR স্ক্যান করে ক্লাস গুনুন', 'Scan the QR to count the class', 'QR स्कैन करके क्लास गिनें')}</h2><video id="v" playsinline muted class="hide"></video>
    <button class="btn blue block mt" id="cam">📷 ${L('ক্যামেরা চালু করুন', 'Turn on camera', 'कैमरा चालू करें')}</button>
    <label>${L('অথবা কোড লিখুন', 'Or type the code', 'या कोड लिखें')}</label><div class="flex"><input id="code" placeholder="S2W-XXXXXX" autocapitalize="characters"><button class="btn sm" id="sub">${L('দেখুন', 'Check', 'देखें')}</button></div>
    <div id="res"></div></div>`;
  loadClaims($('#claims'));
  const handle = async (code, force = false) => {
    stopCam(); $('#v').classList.add('hide');
    const box = $('#res'); box.innerHTML = `<div class="mut mt">${L('মিলিয়ে দেখা হচ্ছে…', 'Checking…', 'जाँच हो रही है…')}</div>`;
    try {
      const r = await sapi('scan', { qr: code, force });
      const cnt = `${N(r.done)}/${N(r.package)}`;
      const payBox = r.can_pay && r.due > 0 ? `<div class="card" style="background:#fffaf0;border:1.5px solid #f6e3a6;margin-top:10px"><b>${L('বাকি', 'Due', 'बाकी')} ${money(r.due)}</b> <span class="mut">· ${byTxt(r.due_by_class)}</span>
        <div class="flex mt wrapf"><input id="pamt" inputmode="numeric" placeholder="${L('এখন কত দিলেন (₹)', 'Paid now (₹)', 'अभी कितना दिया (₹)')}" style="flex:1;min-width:140px"><button class="btn sm" id="pgo">${L('জমা নিন', 'Record', 'जमा करें')}</button></div>
        <div class="mt"><span class="mut">${L('বাকিটা', 'The rest', 'बाकी')}:</span> ${bySelect('pby', r.due_by_class)}</div><div id="pmsg"></div></div>` : '';
      const feeBox = r.fee_due ? `<div class="warn">💰 ${L(`টাকা বাকি${r.due ? ' ' + money(r.due) : ''}। পরের ক্লাসে নিয়ে আসতে বলুন।`, `Fee due${r.due ? ' ' + money(r.due) : ''}. Ask them to bring it to the next class.`, `फीस बाकी${r.due ? ' ' + money(r.due) : ''}। अगली क्लास में लाने को कहें।`)}<div class="mt">${remindBtn({ id: r.student_id, name: r.name, phone: r.phone, done: r.done, due_by_class: r.due_by_class }, r.due)}</div></div>` : '';
      const claimBox = r.pay_claim ? `<div class="warn">💵 ${L(`শিক্ষার্থী জানিয়েছেন ${money(r.pay_claim.amount)} দিয়েছেন (${methodTxt(r.pay_claim.method)})। পেয়ে থাকলে নিচে জমা করুন।`, `The student says they paid ${money(r.pay_claim.amount)} (${methodTxt(r.pay_claim.method)}). Record it below if you got it.`, `स्टूडेंट ने बताया ${money(r.pay_claim.amount)} दे दिए (${methodTxt(r.pay_claim.method)})। मिले हों तो नीचे जमा करें।`)}</div>` : '';
      const bindPay = () => { if (r.pay_claim && $('#pamt')) $('#pamt').value = r.pay_claim.amount; if (!$('#pgo')) return; $('#pgo').onclick = async () => { try { const x = await sapi('payment', { id: r.student_id, amount: $('#pamt').value, due_by_class: $('#pby').value }); $('#pmsg').innerHTML = `<div class="okmsg">✓ ${L('জমা হলো।', 'Recorded.', 'जमा हो गया।')} ${x.due > 0 ? `${L('বাকি', 'Due', 'बाकी')} ${money(x.due)} · ${byTxt(x.due_by_class)}` : L('পুরো টাকা দেওয়া হয়ে গেছে', 'Fully paid', 'पूरी फीस जमा')}</div>`; $('#pgo').disabled = true; loadClaims($('#claims')); } catch (e) { $('#pmsg').innerHTML = `<div class="err">${esc(e.message)}</div>`; } }; };
      if (r.ok) { box.innerHTML = `<div class="okmsg">✓ ${esc(r.name)}: ${L('ক্লাস গোনা হলো', 'class counted', 'क्लास गिनी गई')} (${cnt})${r.walk_in ? ' · ' + L('বুকিং ছাড়া', 'without booking', 'बिना बुकिंग') : ''}</div>` + feeBox + claimBox + payBox; bindPay(); }
      else if (r.reason === 'no_booking') { box.innerHTML = `<div class="err">${L(`${esc(r.name)}-এর এখন কোনো বুকিং নেই (${cnt})।`, `${esc(r.name)} has no booking now (${cnt}).`, `${esc(r.name)} की अभी कोई बुकिंग नहीं है (${cnt})।`)}</div><button class="btn block" id="force">${L('স্কুটি ফাঁকা থাকলে তবু ক্লাস দিন', 'Give the class anyway if a scooty is free', 'स्कूटी खाली हो तो फिर भी क्लास दें')}</button>` + feeBox + claimBox + payBox; $('#force').onclick = () => handle(code, true); bindPay(); }
      else { box.innerHTML = `<div class="err">${esc(r.name ? r.name + ': ' : '')}${{ unknown_qr: L('এই QR চেনা যাচ্ছে না', 'This QR isn’t recognised', 'यह QR पहचाना नहीं गया'), already_today: L('আজকের ক্লাস আগেই গোনা হয়েছে', 'Today’s class is already counted', 'आज की क्लास पहले ही गिनी जा चुकी है'), package_used: L('সব ক্লাস শেষ', 'All classes used', 'सारी क्लास पूरी'), pending: L('এখনো অনুমোদন হয়নি (শিক্ষার্থী তালিকায় অনুমোদন দিন)', 'Not approved yet (approve in the students list)', 'अभी अप्रूव नहीं हुआ (स्टूडेंट लिस्ट में अप्रूव करें)'), not_active: L('এই শিক্ষার্থী এখন চালু নেই', 'This student is not active', 'यह स्टूडेंट अभी चालू नहीं है'), full: L('সব স্কুটি এখন বুক', 'All scooties are booked now', 'सारी स्कूटी अभी बुक हैं'), expired: L('ভর্তির মেয়াদ শেষ (অ্যাডমিন মেয়াদ বাড়াতে পারবেন)', 'Validity from admission is over (the admin can extend it)', 'एडमिशन की वैधता ख़त्म (एडमिन बढ़ा सकते हैं)') }[r.reason] || r.reason}</div>` + feeBox + claimBox + payBox; bindPay(); }
    } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $('#sub').onclick = () => handle($('#code').value.trim().toUpperCase());
  $('#cam').onclick = async () => {
    try {
      await loadJsQR();
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#v'); v.srcObject = camStream; v.classList.remove('hide'); await v.play();
      const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
      const tick = () => { if (!camStream) return; if (v.readyState === 4) { c.width = v.videoWidth; c.height = v.videoHeight; x.drawImage(v, 0, 0); const d = x.getImageData(0, 0, c.width, c.height); const q = window.jsQR(d.data, c.width, c.height); if (q && q.data) { navigator.vibrate?.(80); return handle(q.data.trim()); } } camTimer = requestAnimationFrame(tick); };
      tick();
    } catch (e) { toast(L('ক্যামেরা চালু হলো না। কোড লিখে দিন।', 'Camera didn’t start. Type the code instead.', 'कैमरा चालू नहीं हुआ। कोड लिख दें।')); }
  };
}

function admitTab(el) {
  const st = { kind: 'scooty', package: 15, full: false, photo: '', id_photo: '' };
  el.innerHTML = `<div class="card"><h2>${L('নতুন ভর্তি', 'New admission', 'नया एडमिशन')}</h2>
    <label>${L('নাম', 'Name', 'नाम')} *</label><input id="nm" autocomplete="off">
    <label>${L('ফোন', 'Phone', 'फ़ोन')} *</label><input id="ph" inputmode="numeric" maxlength="10">
    <label>${L('ঠিকানা', 'Address', 'पता')}</label><input id="ad">
    <label>${L('কী শিখবেন', 'Learning', 'क्या सीखेंगे')}</label><div class="seg" id="kind"><button data-v="scooty" class="on">${kindName('scooty')}</button><button data-v="bike">${kindName('bike')}</button></div>
    <label>${L('কটা ক্লাস', 'Number of classes', 'कितनी क्लास')}</label><div class="seg" id="pkg"><button data-v="15" class="on">${L('১৫টা', '15', '15')}</button><button data-v="10">${L('১০টা', '10', '10')}</button></div>
    <div class="grid2"><div><label>${L('মোট ফি', 'Total fee', 'कुल फीस')} (₹)</label><input id="fee" inputmode="numeric"></div><div><label>${L('এখন দিচ্ছেন', 'Paying now', 'अभी दे रहे हैं')} (₹)</label><input id="paid" inputmode="numeric"></div></div>
    <div class="chk"><input type="checkbox" id="full"><span>${L('পুরো টাকা দিয়েছেন', 'Paid in full', 'पूरी फीस दे दी')}</span></div>
    <div class="mut" id="due"></div>
    <div id="dbbox" class="hide"><label>${L('বাকি টাকা কবে দেবেন', 'Rest of the fee due', 'बाकी फीस कब तक')}</label>${bySelect('dby', 5)}</div>
    <label>${L('শিক্ষার্থীর ছবি', 'Student photo', 'स्टूडेंट की फ़ोटो')}</label><input type="file" accept="image/*" capture="user" id="ph1"><img id="pv1" class="photo-prev hide">
    <label>${L('পরিচয়পত্র (ঐচ্ছিক)', 'ID proof (optional)', 'पहचान पत्र (ज़रूरी नहीं)')}</label><select id="idt"><option value="">${L('দিচ্ছেন না', 'Not given', 'नहीं दे रहे')}</option><option value="aadhaar">${L('আধার', 'Aadhaar', 'आधार')}</option><option value="voter">${L('ভোটার কার্ড', 'Voter card', 'वोटर कार्ड')}</option><option value="pan">${L('প্যান কার্ড', 'PAN card', 'पैन कार्ड')}</option><option value="driving">${L('ড্রাইভিং লাইসেন্স', 'Driving licence', 'ड्राइविंग लाइसेंस')}</option></select>
    <div id="idbox" class="hide"><input type="file" accept="image/*" capture="environment" id="ph2"><div class="mut">${L('ছবি থেকে শুধু শেষ ৪টে সংখ্যা রাখা হবে, ছবিটা রাখা হবে না।', 'Only the last 4 digits are kept from the photo; the photo itself is not stored.', 'फ़ोटो से सिर्फ़ आख़िरी 4 अंक रखे जाएँगे, फ़ोटो नहीं रखी जाएगी।')}</div></div>
    <div id="msg"></div><button class="btn block mt2" id="go">${L('ভর্তি করুন', 'Admit', 'एडमिशन करें')}</button></div>`;
  const seg = (id, key, num) => el.querySelectorAll(`#${id} button`).forEach((b) => b.onclick = () => { st[key] = num ? Number(b.dataset.v) : b.dataset.v; el.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b)); });
  seg('kind', 'kind'); seg('pkg', 'package', true);
  const upd = () => { const f = Number($('#fee').value) || 0; const p = st.full ? f : Number($('#paid').value) || 0; if (st.full) $('#paid').value = f || ''; $('#due').innerHTML = f ? `${L('বাকি থাকবে', 'Due', 'बाकी रहेगा')}: <b>${money(Math.max(0, f - p))}</b>` : ''; $('#dbbox').classList.toggle('hide', !(f > p)); };
  $('#fee').oninput = upd; $('#paid').oninput = upd; $('#full').onchange = (e) => { st.full = e.target.checked; $('#paid').disabled = st.full; upd(); };
  $('#ph1').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; st.photo = await compress(f, 720, 0.7); $('#pv1').src = st.photo; $('#pv1').classList.remove('hide'); };
  $('#idt').onchange = (e) => $('#idbox').classList.toggle('hide', !e.target.value);
  $('#ph2').onchange = async (e) => { const f = e.target.files[0]; if (f) st.id_photo = await compress(f, 1400, 0.8); };
  const submit = async (allow_duplicate = false) => {
    $('#go').disabled = true;
    try {
      const r = await sapi('admit', { name: $('#nm').value, phone: $('#ph').value, address: $('#ad').value, kind: st.kind, package: st.package, total_fee: $('#fee').value, paid_now: $('#paid').value, full_paid: st.full, photo: st.photo, id_photo: st.id_photo, id_type: $('#idt').value, due_by_class: $('#dby').value, allow_duplicate });
      admitted(el, r);
    } catch (e) {
      if (e.status === 409 && !allow_duplicate) { $('#msg').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn ghost block" id="dup">${L('তবু ভর্তি করুন', 'Admit anyway', 'फिर भी एडमिशन करें')}</button>`; $('#dup').onclick = () => submit(true); }
      else $('#msg').innerHTML = `<div class="err">${esc(e.message)}</div>`;
      $('#go').disabled = false;
    }
  };
  $('#go').onclick = () => submit(false);
}
function admitted(el, r) {
  const link = studentUrl(r.token);
  const msg = L(`নমস্কার ${r.name}, Seekho 2 Wheeler পাটুলিতে আপনার ভর্তি হয়ে গেছে। এই লিংক থেকে ক্লাস বুক করবেন আর ক্লাসে এসে QR দেখাবেন: ${link}`, `Hello ${r.name}, your admission at Seekho 2 Wheeler Patuli is done. Book your classes from this link and show the QR when you come to class: ${link}`, `नमस्ते ${r.name}, Seekho 2 Wheeler पाटुली में आपका एडमिशन हो गया है। इस लिंक से क्लास बुक करें और क्लास में आकर QR दिखाएँ: ${link}`);
  el.innerHTML = `<div class="card center"><h2>${L('ভর্তি হয়ে গেছে ✓', 'Admission done ✓', 'एडमिशन हो गया ✓')}</h2><div class="big">${esc(r.name)}</div>

async function runBlock(box, windows, vehicle, reason, done) {
  box.innerHTML = `<div class="mut mt">${L('দেখা হচ্ছে…', 'Checking…', 'देख रहे हैं…')}</div>`;
  try {
    const moved = [], cancelled = [];
    for (const [a, b] of windows) { const x = await sapi('block', { starts: a, ends: b, vehicle, reason, dry: true }); moved.push(...x.moved); cancelled.push(...x.cancelled); }
    const go = async () => {
      box.innerHTML = `<div class="mut mt">${L('বন্ধ করা হচ্ছে…', 'Closing…', 'बंद कर रहे हैं…')}</div>`;
      const mv = [], cn = [];
      for (const [a, b] of windows) { const x = await sapi('block', { starts: a, ends: b, vehicle, reason }); mv.push(...x.moved); cn.push(...x.cancelled); }

        ${mv.length ? `<div class="mut mt">${L('অন্য গাড়িতে সরানো হয়েছে', 'Moved to another vehicle', 'दूसरी गाड़ी पर भेजा')}: ${whoList(mv, (x) => ' → ' + esc(x.to))}</div>` : ''}
        ${cn.length ? `<h3>${L('এঁদের ক্লাস বাতিল হলো, WhatsApp-এ জানান', 'These classes were cancelled. Tell them on WhatsApp', 'इनकी क्लास कैंसल हुई, WhatsApp पर बताएँ')}</h3><div class="list">${cn.map((c) => `<div class="it"><div style="flex:1"><b>${esc(c.name)}</b><div class="mut">${tDay(c.slot)} ${tTime(c.slot)}</div></div>${notifyBtn({ ...c, note: reason })}</div>`).join('')}</div>` : ''}
        <button class="btn block mt2" id="bok">${L('ঠিক আছে', 'OK', 'ठीक है')}</button>`;

      ${cancelled.length ? `${L(`${N(cancelled.length)} জনের ক্লাস বাতিল হবে (অন্য গাড়ি ফাঁকা নেই)`, `${cancelled.length} class(es) will be cancelled (no other vehicle free)`, `${cancelled.length} क्लास कैंसल होंगी (दूसरी गाड़ी खाली नहीं)`)}: ${whoList(cancelled)}` : ''}</div>

    const windows = [];

function bars(data) {
  const max = Math.max(1, ...data.map((d) => d.v)); const w = 320, h = 160, bw = w / Math.max(1, data.length), rw = Math.min(46, bw - 12);
  return `<svg viewBox="0 0 ${w} ${h + 26}" width="100%" role="img">${data.map((d, i) => { const bh = Math.round((h - 18) * d.v / max); return `<rect x="${i * bw + (bw - rw) / 2}" y="${h - bh}" width="${rw}" height="${bh}" rx="5" fill="${i === data.length - 1 ? '#ff5a0a' : '#0b3a8f'}"/><text x="${i * bw + bw / 2}" y="${h - bh - 4}" font-size="10" text-anchor="middle" fill="#14213d">${d.v >= 1000 ? Math.round(d.v / 1000) + 'k' : d.v}</text><text x="${i * bw + bw / 2}" y="${h + 16}" font-size="10" text-anchor="middle" fill="#5b6478">${esc(d.l)}</text>`; }).join('')}</svg>`;
}
function pie(parts) {
  const tot = parts.reduce((t, p) => t + p.v, 0) || 1; let a = -Math.PI / 2; const R = 60, c = 70;
  const segs = parts.filter((p) => p.v > 0).map((p) => { const a2 = a + 2 * Math.PI * p.v / tot; const large = a2 - a > Math.PI ? 1 : 0; const d = parts.filter((x) => x.v > 0).length === 1 ? `M${c} ${c - R}A${R} ${R} 0 1 1 ${c - 0.01} ${c - R}Z` : `M${c} ${c}L${c + R * Math.cos(a)} ${c + R * Math.sin(a)}A${R} ${R} 0 ${large} 1 ${c + R * Math.cos(a2)} ${c + R * Math.sin(a2)}Z`; a = a2; return `<path d="${d}" fill="${p.c}"/>`; }).join('');
  return `<div class="flex"><svg viewBox="0 0 140 140" width="120">${segs}<circle cx="70" cy="70" r="30" fill="#fff"/></svg><div>${parts.map((p) => `<div><span class="legend"><span><i style="background:${p.c}"></i>${esc(p.l)}: <b>${p.fmt ? p.fmt(p.v) : N(p.v)}</b></span></span></div>`).join('')}</div></div>`;
}

      <div class="card"><div class="flex between wrapf"><h3>${L('কার কত বাকি', 'Who owes what', 'किसका कितना बाकी')}</h3><div class="flex"><button class="btn sm" id="csv">${L('টাকার CSV', 'Payments CSV', 'पैसों की CSV')}</button><button class="btn sm blue" id="csvb">${L('বুকিংয়ের CSV', 'Bookings CSV', 'बुकिंग की CSV')}</button></div></div><div class="list">${d.dues.map((x) => `<div class="it" data-id="${x.id}"><div style="flex:1"><b>${esc(x.name)}</b><div class="mut">${esc(x.phone)} · ${L('দিয়েছেন', 'paid', 'दिए')} ${money(x.paid)} / ${money(x.total_fee)}</div></div><b style="color:var(--orange)">${money(x.due)}</b></div>`).join('') || `<div class="mut">${L('কারও বাকি নেই', 'Nobody owes anything', 'किसी का कुछ बाकी नहीं')}</div>`}</div></div>`;
    const dl = async (type) => { const month = prompt(L('কোন মাস? (YYYY-MM)', 'Which month? (YYYY-MM)', 'कौन सा महीना? (YYYY-MM)'), istToday().slice(0, 7)); if (!month) return; const r = await sapi('csv', { month, type }); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + r.csv], { type: 'text/csv' })); a.download = `patuli-${type}-${month}.csv`; a.click(); };
    $('#csv').onclick = () => dl('payments'); $('#csvb').onclick = () => dl('bookings');
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// ---------- settings
async function settingsTab(el) {
  const r = await sapi('settings'); const b = r.branch; const p = b.trainer_perms;
  const SAVE = L('সেভ', 'Save', 'सेव');
  el.innerHTML = `<div class="card"><h2>${L('ট্রেনার কী দেখতে পাবেন', 'What trainers can see', 'ट्रेनर क्या देख सकेंगे')}</h2>
    ${[['bookings', L('বুকিং ক্যালেন্ডার', 'Booking calendar', 'बुकिंग कैलेंडर')], ['students', L('শিক্ষার্থীর তালিকা', 'Student list', 'स्टूडेंट लिस्ट')], ['dues', L('বাকি টাকা', 'Dues', 'बाकी पैसे')], ['money', L('টাকা জমা নেওয়া', 'Taking payments', 'पैसे जमा लेना')], ['dashboard', L('হিসাবের ড্যাশবোর্ড', 'Accounts dashboard', 'हिसाब का डैशबोर्ड')]].map(([k, l]) => `<div class="chk"><input type="checkbox" data-p="${k}" ${p[k] ? 'checked' : ''}><span>${l}</span></div>`).join('')}
    <button class="btn blue block" id="sp">${SAVE}</button></div>
    <div class="card"><h2>${L('ক্লাসের সময়', 'Class hours', 'क्लास का समय')}</h2><div class="mut">${L('২৪ ঘণ্টার হিসাবে, যেমন 08:00 – 11:00', '24-hour format, e.g. 08:00 – 11:00', '24 घंटे के हिसाब से, जैसे 08:00 – 11:00')}</div><div id="hrs"></div><button class="btn ghost sm mt" id="addh">+ ${L('সময় যোগ', 'Add hours', 'समय जोड़ें')}</button><button class="btn blue block mt" id="sh">${SAVE}</button></div>
    <div class="card"><h2>${L('বুকিংয়ের নিয়ম', 'Booking rules', 'बुकिंग के नियम')}</h2><div class="grid2"><div><label>${L('কত ঘণ্টা আগে বুকিং খোলে', 'Booking opens (hours before)', 'कितने घंटे पहले बुकिंग खुले')}</label><input id="r_win" inputmode="numeric" value="${b.window_hours}"></div><div><label>${L('কত ঘণ্টা আগে পর্যন্ত বুক', 'Book until (hours before)', 'कितने घंटे पहले तक बुक')}</label><input id="r_lead" inputmode="numeric" value="${b.lead_hours}"></div><div><label>${L('কত ঘণ্টা আগে পর্যন্ত বাতিল', 'Cancel until (hours before)', 'कितने घंटे पहले तक कैंसल')}</label><input id="r_can" inputmode="numeric" value="${b.cancel_hours}"></div><div><label>${L('কত দিন না এলে অ্যাকাউন্ট বন্ধ (০ = কখনো না)', 'Pause account after days away (0 = never)', 'कितने दिन न आने पर अकाउंट बंद (0 = कभी नहीं)')}</label><input id="r_ina" inputmode="numeric" value="${b.inactive_days}"></div><div><label>${L('ভর্তির কত দিন পর্যন্ত বুক করা যাবে (০ = সীমা নেই)', 'Days after admission that booking is allowed (0 = no limit)', 'एडमिशन के कितने दिन तक बुकिंग (0 = कोई सीमा नहीं)')}</label><input id="r_val" inputmode="numeric" value="${b.valid_days}"></div></div><div class="chk"><input type="checkbox" id="r_fee" ${b.fee_lock ? 'checked' : ''}><span>${L('পুরো ফি না দিলে "বাকি টাকা কবে" ক্লাসের পরে শিক্ষার্থী নিজে বুক করতে পারবেন না (ট্রেনার বুক করে দিতে পারবেন)', 'Without the full fee, students can’t book past the “fee due by” class themselves (trainers can still book for them)', 'पूरी फीस न देने पर "बाकी फीस कब तक" वाली क्लास के बाद स्टूडेंट ख़ुद बुक नहीं कर सकेंगे (ट्रेनर बुक कर सकते हैं)')}</span></div><button class="btn blue block mt" id="sr">${SAVE}</button></div>
    <div class="card"><h2>${L('গাড়ি', 'Vehicles', 'गाड़ियाँ')}</h2><div class="list">${r.vehicles.map((v) => `<div class="it"><div style="flex:1"><b>${esc(v.label)}</b> <span class="mut">${kindName(v.kind)}</span></div><button class="btn sm ${v.active ? 'ghost' : 'green'}" data-v="${v.id}" data-a="${v.active ? 0 : 1}">${v.active ? L('বন্ধ করুন', 'Turn off', 'बंद करें') : L('চালু করুন', 'Turn on', 'चालू करें')}</button></div>`).join('')}</div>
      <div class="flex mt"><input id="vl" placeholder="${L('নাম, যেমন Scooty 3', 'Name, e.g. Scooty 3', 'नाम, जैसे Scooty 3')}"><select id="vk" style="width:120px"><option value="scooty">${kindName('scooty')}</option><option value="bike">${kindName('bike')}</option></select><button class="btn sm" id="addv">${L('যোগ', 'Add', 'जोड़ें')}</button></div></div>
    <div class="card"><h2>${L('PIN ও পাসওয়ার্ড', 'PIN and password', 'PIN और पासवर्ड')}</h2><label>${L('ট্রেনারদের নতুন PIN (৪–৮ সংখ্যা)', 'New trainer PIN (4–8 digits)', 'ट्रेनरों का नया PIN (4–8 अंक)')}</label><input id="pin" inputmode="numeric"><label>${L('অ্যাডমিনের নতুন পাসওয়ার্ড (অন্তত ৮ অক্ষর)', 'New admin password (at least 8 characters)', 'एडमिन का नया पासवर्ड (कम से कम 8 अक्षर)')}</label><input id="pw" type="password"><button class="btn blue block mt" id="spin">${L('বদলান', 'Change', 'बदलें')}</button></div>
    <div class="card"><h2>${L('কে কী করেছে', 'Activity log', 'किसने क्या किया')}</h2><button class="btn ghost sm" id="aud">${L('দেখুন', 'Show', 'देखें')}</button><div class="list" id="audl"></div></div>
    <button class="btn ghost block" id="out">${L('লগআউট', 'Log out', 'लॉगआउट')}</button>`;
  let hours = b.hours.slice();
  const drawH = () => { $('#hrs').innerHTML = hours.map((h, i) => `<div class="flex mt"><input value="${h[0]}" data-i="${i}" data-k="0" style="width:110px"> – <input value="${h[1]}" data-i="${i}" data-k="1" style="width:110px"><button class="btn sm ghost" data-del="${i}">✕</button></div>`).join(''); $('#hrs').querySelectorAll('input').forEach((x) => x.oninput = () => hours[x.dataset.i][x.dataset.k] = x.value.trim()); $('#hrs').querySelectorAll('[data-del]').forEach((x) => x.onclick = () => { hours.splice(Number(x.dataset.del), 1); drawH(); }); };
  drawH(); $('#addh').onclick = () => { hours.push(['16:00', '18:00']); drawH(); };
  const save = async (fields, msg = L('সেভ হলো', 'Saved', 'सेव हो गया')) => { try { await sapi('save_settings', { fields }); toast(msg); settingsTab(el); } catch (e) { toast(e.message); } };
  $('#sp').onclick = () => { const tp = {}; el.querySelectorAll('[data-p]').forEach((x) => tp[x.dataset.p] = x.checked); save({ trainer_perms: tp }); };
  $('#sh').onclick = () => save({ hours });
  $('#sr').onclick = () => save({ window_hours: $('#r_win').value, lead_hours: $('#r_lead').value, cancel_hours: $('#r_can').value, inactive_days: $('#r_ina').value, valid_days: $('#r_val').value, fee_lock: $('#r_fee').checked });
  el.querySelectorAll('[data-v]').forEach((x) => x.onclick = () => save({ toggle_vehicle: { id: x.dataset.v, active: x.dataset.a === '1' } }));
  $('#addv').onclick = () => save({ add_vehicle: { label: $('#vl').value || 'Scooty', kind: $('#vk').value } });
  $('#spin').onclick = () => { const f = {}; if ($('#pin').value) f.trainer_pin = $('#pin').value; if ($('#pw').value) f.admin_password = $('#pw').value; if (Object.keys(f).length) save(f, L('বদলানো হলো', 'Changed', 'बदल दिया')); };
  $('#aud').onclick = async () => {
    const a = await sapi('audit');
    const AL = { reactivate: L('আবার চালু', 'Restarted', 'फिर से चालू'), reactivate_request: L('চালুর অনুরোধ', 'Restart request', 'चालू करने की रिक्वेस्ट'), book: L('বুক', 'Booked', 'बुक'), cancel: L('শিক্ষার্থী বাতিল', 'Student cancelled', 'स्टूडेंट ने कैंसल किया'), centre_cancel: L('সেন্টার বাতিল', 'Centre cancelled', 'सेंटर ने कैंसल किया'), attend: L('ক্লাস গোনা', 'Class counted', 'क्लास गिनी'), admit: L('ভর্তি', 'Admission', 'एडमिशन'), approve: L('অনুমোদন', 'Approved', 'अप्रूव'), reject: L('বাতিল (কার্ড)', 'Rejected (card)', 'रिजेक्ट (कार्ड)'), block: L('বন্ধ', 'Closed', 'बंद'), unblock: L('খোলা', 'Opened', 'खोला'), payment: L('টাকা জমা', 'Payment', 'पैसे जमा'), update_student: L('সম্পাদনা', 'Edited', 'बदलाव'), settings: L('সেটিংস', 'Settings', 'सेटिंग्स'), login_fail: L('ভুল লগইন', 'Failed login', 'गलत लॉगिन'), old_submit: L('কার্ড জমা', 'Card submitted', 'कार्ड जमा'), delete_student: L('শিক্ষার্থী মোছা', 'Student deleted', 'स्टूडेंट मिटाया'), fee_reminder: L('টাকার রিমাইন্ডার', 'Fee reminder', 'फीस रिमाइंडर'), delete_forever: L('চিরতরে মোছা', 'Deleted for good', 'हमेशा के लिए मिटाया'), restore: L('ফেরত আনা', 'Restored', 'वापस लाया'), pay_claim: L('শিক্ষার্থী: টাকা দিয়েছি', 'Student: I have paid', 'स्टूडेंट: पैसे दे दिए'), pay_claim_no: L('টাকা পাওয়া যায়নি', 'Payment not received', 'पैसे नहीं मिले') };
    $('#audl').innerHTML = a.audit.map((x) => `<div class="it"><div style="flex:1"><b>${AL[x.action] || x.action}</b> · ${esc(x.actor)}${(x.name || x.detail?.name) ? ' · ' + esc(x.name || x.detail.name) : ''}${x.detail && x.detail.slot ? ' · ' + tDay(x.detail.slot) + ' ' + tTime(x.detail.slot) : ''}<div class="mut" style="font-size:12px">${tDay(x.at)} ${tTime(x.at)}</div></div></div>`).join('');
  };
  $('#out').onclick = () => { saveSession(null); S = null; loginPage(); };
}

// =========================================================== start
(async () => {
  if (params.get('s')) return studentPage(params.get('s'));
  if (params.get('old')) { const mine = params.get('new') ? '' : loadMe(); if (mine) { params.set('reg', '1'); history.replaceState(null, '', `/app/?s=${mine}&reg=1` + (params.get('api') ? `&api=${encodeURIComponent(params.get('api'))}` : '')); return studentPage(mine); } return oldPage(params.get('old')); }
  S = loadSession();
  if (!S) return loginPage();
  try { const w = await api('whoami', { session: S.session }); S.perms = w.perms; S.role = w.role; S.branch = w.branch; saveSession(S); staffHome(); } catch (e) { saveSession(null); S = null; loginPage(); }
})();
</script>
